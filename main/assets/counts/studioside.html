<script>
 const urlParams = new URLSearchParams(window.location.search);
  const params = {};

  for (const [key, value] of urlParams.entries()) {
    if (value.toLowerCase() === "true") {
        params[key] = true;  
    } else if (value.toLowerCase() === "false") {
        params[key] = false;  
    } else if (!isNaN(value) && value.trim() !== '') {
        params[key] = parseFloat(value);  
    } else {
        params[key] = value;  
    }
  }

  var id = urlParams.get("id") || "UClOyuxZvQkoHoIn15kNbkUw";    
  
  odometers = Odometer.init();
    let opts = {
        animation: ['default', 'byDigit', 'count', 'minimal'][1],
        downColor: "white",
        duration: 2 * 1000,
        removeLeadingZeros: true,
        reverseAnimation: false,
        format: ",ddd",
        upColor: "white"
    }
    odometers[0].options = opts;
    odometers[1].options = opts;
    odometers[2].options = opts;
    odometers[3].options = opts;
    odometers[4].options = opts;

  // Function to increment the variable
  function incrementVariable() {
      const data = fetchyoutubechannel(id);
      views.innerHTML = parseInt(data.studioViews);
      likes.innerHTML = parseInt(data.studioLikes);
      dislikes.innerHTML = parseInt(data.studioDislikes);
      comments.innerHTML = parseInt(data.studioComments);
      uploads.innerHTML = parseInt(data.counts[5]); 
  }

      // Increment the variable every 2 seconds
      setInterval(incrementVariable, 2000);
</script>
